<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLROLL Attendance dApp</title>
    <link rel="stylesheet" href="/CSS/theme.css" />
    <link rel="stylesheet" href="/CSS/teacher.css" />
    <link rel="icon" href="assets/images/logo.png" sizes="16x16" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <nav>
      <div class="profile">
        <a href="#"> <img src="/assets/images/user.png" alt="userlogo" /></a>
        <h3 id="sidebar-username"></h3>
      </div>
      <div class="mainmenu">
        <h3>Main Menu</h3>
        <div class="Micon">
          <a href="#">
            <span class="material-symbols-outlined menuicon">dashboard</span>
            <span class="iconactionname">Dashboard</span></a
          >
        </div>
        <div class="Micon">
          <a href="#"
            ><span class="material-symbols-outlined menuicon">
              quick_reference_all
            </span>
            <span class="iconactionname">Research</span></a
          >
        </div>
        <div class="Micon">
          <a href="#"
            ><span class="material-symbols-outlined"> menu_book </span>
            <span class="iconactionname"> Course</span></a
          >
        </div>
      </div>
      <div class="general">
        <h3>General</h3>
        <div class="Micon">
          <a href="#">
            <span class="material-symbols-outlined menuicon">folder</span>
            <span class="iconactionname">Projects</span></a
          >
        </div>
        <div class="Micon">
          <a href="#">
            <span class="material-symbols-outlined menuicon">diversity_3</span>
            <span class="iconactionname">Teams</span></a
          >
        </div>
      </div>
      <div class="account">
        <h3>Account</h3>
        <div class="Micon">
          <a href="#">
            <span class="material-symbols-outlined menuicon"
              >account_circle</span
            >
            <span class="iconactionname">My Account</span></a
          >
        </div>
        <div class="Micon">
          <a href="#">
            <span class="material-symbols-outlined menuicon">logout</span>
            <span class="iconactionname">Logout</span></a
          >
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="header">
        <h1>Teacher Dashboard</h1>
      </div>
      <div class="body">
        <p>Mark attendance for your class</p>
        <select id="student-list">
          <option selected disabled>Select Student</option>
        </select>

        <div class="role-option">
          <div class="role">
            <input type="radio" name="status" id="present" value="Present" />
            <label for="present">Present</label>
          </div>
          <div class="role">
            <input type="radio" name="status" id="absent" value="Absent" />
            <label for="absent">Absent</label>
          </div>
        </div>

        <button id="mark-attendance-btn">Mark Attendance</button>
      </div>
      <h4>Attendance Records</h4>
      <div class="attendance-list"></div>
      <div class="footer">
        <button class="footer-btn">Back to Home</button>
      </div>
    </div>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="/JS/teacher.js"></script>
  </body>
</html>
