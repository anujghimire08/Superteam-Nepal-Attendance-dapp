<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Himalaya Darshan College Attendance dApp</title>
    <link rel="stylesheet" href="/CSS/theme.css" />
    <link rel="stylesheet" href="/CSS/student.css" />
    <link rel="icon" href="assets/images/icon.png" sizes="16x16" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Student Dashboard</h2>
      </div>
      <div class="body">
        <p>View your attendance</p>
        <div class="list-box">
          <table frame="box" rules="all">
            <thead>
              <tr>
                <th>Wallet Address</th>
                <th>Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <!-- <p class="list-attendance">ABC123 : Present</p>
          <p class="list-attendance">XYZ456 : Absent</p> -->
        </div>
      </div>
      <div class="footer">
        <button class="footer-btn">Back to Home</button>
      </div>
    </div>
    <script src="/JS/student.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://unpkg.com/@coral-xyz/anchor@latest/dist/esm/index.js"></script>
  </body>
</html>
