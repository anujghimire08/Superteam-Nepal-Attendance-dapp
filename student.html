<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLROL Attendance dApp</title>
    <link rel="stylesheet" href="/CSS/theme.css" />
    <link rel="stylesheet" href="/CSS/student.css" />
    <link rel="icon" href="assets/images/logo.png" sizes="16x16" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <img src="" alt="" />
        <nav>
          <span id="noti" class="material-symbols-outlined">
            notifications
            <span id="noti-num">3</span>
          </span>
          <span class="material-symbols-outlined">chat</span>
          <img src="/assets/images/user.png" alt="user.png" id="user" />
        </nav>
      </header>

      <div class="header">
        <h2>Student Dashboard</h2>
      </div>
      <div class="body">
        <p>View your attendance</p>
        <div class="list-box">
          <table frame="box" rules="all">
            <thead>
              <tr>
                <th>Date</th>
                <th>Transaction Address</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="footer">
        <button class="footer-btn">Back to Home</button>
      </div>
    </div>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="/JS/student.js"></script>
  </body>
</html>
