<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLROL Attendance dApp</title>
    <link rel="stylesheet" href="/CSS/theme.css" />
    <link rel="stylesheet" href="/CSS/login.css" />
    <link rel="icon" href="assets/images/logo.png" sizes="16x16" />
  </head>
  <body>
    <div class="container">
      <h1>Welcome!</h1>
      <h1>Attendance dApp</h1>
      <p>Enter your Name and Role</p>

      <form method="post">
        <input
          type="text"
          name="userName"
          id="user-name"
          placeholder="username"
          required
        />

        <div class="inputs-btn">
          <div class="role">
            <input
              type="radio"
              name="role"
              value="teacher"
              id="teacher"
              required
            />
            <label for="teacher">Teacher</label>
          </div>
          <div class="role">
            <input
              type="radio"
              name="role"
              value="student"
              id="student"
              required
            />
            <label for="student">Student</label>
          </div>
        </div>

        <button type="submit">Continue</button>
      </form>
    </div>
    <script src="/JS/login.js"></script>
  </body>
</html>
